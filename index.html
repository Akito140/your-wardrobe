<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6fa">
    <meta name="description" content="Каталог вещей, подборки и продавцы Stylo.">
    <title>Каталог — Stylo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css?v=stylist-chat-1" rel="stylesheet">
  </head>
  <body class="app-page">
    <a class="skip" href="#main">К содержимому</a>
    <header class="app-header">
      <a class="app-wordmark" href="index.html">stylo<span>.</span></a>
      <a class="header-profile" href="style-profile.html" aria-label="Открыть профиль">AK</a>
    </header>

    <main id="main" class="app-shell catalog-shell">
      <section class="app-intro">
        <p class="eyebrow">ВЕЩИ И ЛОКАЛЬНЫЕ БУТИКИ</p>
        <h1>Каталог</h1>
      </section>

      <label class="catalog-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="catalog-search" type="search" aria-label="Поиск по каталогу" placeholder="Найти вещь" autocomplete="off">
      </label>

      <div class="filter-rail catalog-filters" role="group" aria-label="Категории товаров">
        <button class="filter-chip is-selected" type="button" data-product-filter="all" aria-pressed="true">Все вещи</button>
        <button class="filter-chip" type="button" data-product-filter="tops" aria-pressed="false">Верх</button>
        <button class="filter-chip" type="button" data-product-filter="outerwear" aria-pressed="false">Верхняя одежда</button>
        <button class="filter-chip" type="button" data-product-filter="bottoms" aria-pressed="false">Брюки</button>
        <button class="filter-chip" type="button" data-product-filter="shoes" aria-pressed="false">Обувь</button>
        <button class="filter-chip" type="button" data-product-filter="accessories" aria-pressed="false">Аксессуары</button>
      </div>

      <div class="catalog-heading">
        <h2>Подобрали для тебя</h2>
        <span id="catalog-count" aria-live="polite"></span>
      </div>
      <section class="product-grid" id="product-grid" aria-label="Каталог вещей"></section>
      <div class="empty-favorites" id="products-empty" hidden>
        <span aria-hidden="true">⌕</span>
        <h2>Ничего не найдено</h2>
        <p>Попробуй изменить запрос или выбрать другую категорию.</p>
      </div>
    </main>

    <nav class="app-tabs" aria-label="Разделы приложения">
      <a class="app-tab is-active" href="index.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><span>Каталог</span></a>
      <a class="app-tab" href="wardrobe.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l2 14H3L5 7ZM9 7a3 3 0 0 1 6 0"/></svg><span>Гардероб</span></a>
      <a class="app-tab" href="outfit-studio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg><span>Образы</span></a>
      <a class="app-tab" href="style-profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Профиль</span></a>
      <a class="app-tab" href="stylist.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg><span>Стилист</span></a>
    </nav>

    <dialog class="product-dialog" id="product-dialog" aria-labelledby="product-title">
      <div class="product-sheet">
        <div class="dialog-handle" aria-hidden="true"></div>
        <div class="tryon-header">
          <div><p class="eyebrow">КАТАЛОГ</p><h2 id="product-title">Вещь</h2></div>
          <button class="round-icon-button" type="button" data-close-product aria-label="Закрыть карточку">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="product-detail-image-wrap"><img id="product-detail-image" alt=""></div>
        <p class="product-detail-price" id="product-detail-price"></p>
        <dl class="product-specs">
          <div><dt>Материал</dt><dd id="product-material"></dd></div>
          <div><dt>Крой</dt><dd id="product-fit"></dd></div>
          <div><dt>Продавец</dt><dd id="product-seller"></dd></div>
          <div><dt>Контакт</dt><dd><a id="product-contact"></a></dd></div>
        </dl>
        <button class="btn btn-primary order-start" id="order-start" type="button">Заказать</button>
        <form class="order-panel" id="order-form" hidden>
          <label class="form-label" for="order-size">Размер</label>
          <select class="form-select" id="order-size" required></select>
          <fieldset id="order-color-group">
            <legend>Цвет</legend>
            <div class="color-options" id="order-colors"></div>
          </fieldset>
          <button class="btn btn-primary order-submit" type="submit">Продолжить</button>
        </form>
        <p class="order-status" id="order-status" role="status" aria-live="polite"></p>
      </div>
    </dialog>

    <script src="assets/js/app.js?v=tryon-results-2"></script>
  </body>
</html>
