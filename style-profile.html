<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6fa">
    <title>Профиль — Stylo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css?v=looks-08" rel="stylesheet">
  </head>
  <body class="app-page">
    <a class="skip" href="#main">К содержимому</a>
    <header class="app-header">
      <a class="app-wordmark" href="index.html">stylo<span>.</span></a>
      <a class="header-profile" id="header-profile" href="style-profile.html" aria-label="Открыть профиль">AK</a>
    </header>

    <main id="main" class="app-shell profile-shell">
      <section class="app-intro">
        <p class="eyebrow">ПЕРСОНАЛИЗАЦИЯ</p>
        <h1>Твои параметры</h1>
      </section>

      <form id="measurements-form">
        <section class="profile-card" aria-labelledby="photo-title">
          <h2 id="photo-title">Фото для примерки</h2>
          <div class="profile-photo-row">
            <div class="profile-photo-preview" id="profile-photo-preview" aria-hidden="true">＋</div>
            <div>
              <label class="photo-pick" for="profile-photo">Добавить фото в полный рост</label>
              <input id="profile-photo" type="file" accept="image/*" capture="user" hidden>
              <p>Фото в полный рост для примерки.</p>
            </div>
          </div>
          <p class="profile-status" id="photo-status" role="status" aria-live="polite"></p>
        </section>

        <section class="profile-card" aria-labelledby="basic-size-title">
          <h2 id="basic-size-title">Основные размеры</h2>
          <div class="profile-grid">
            <div>
              <label class="form-label" for="profile-height">Рост, см</label>
              <input class="form-control" id="profile-height" name="height" type="number" min="100" max="230" inputmode="numeric" placeholder="Например, 168">
            </div>
            <div>
              <label class="form-label" for="profile-top-size">Размер верха</label>
              <select class="form-select" id="profile-top-size" name="topSize">
                <option value="">Не знаю</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="profile-bottom-size">Размер низа</label>
              <select class="form-select" id="profile-bottom-size" name="bottomSize">
                <option value="">Не знаю</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="profile-shoe-size">Обувь, EU</label>
              <select class="form-select" id="profile-shoe-size" name="shoeSize">
                <option value="">Не знаю</option>
                <option>35</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option>
              </select>
            </div>
          </div>
          <button class="advanced-toggle" type="button" id="advanced-toggle" aria-expanded="false" aria-controls="advanced-measurements">
            <span>Точные мерки, см</span><span aria-hidden="true">＋</span>
          </button>
          <div class="advanced-measurements profile-grid" id="advanced-measurements" hidden>
            <div><label class="form-label" for="profile-chest">Обхват груди</label><input class="form-control" id="profile-chest" name="chest" type="number" min="50" max="180" inputmode="numeric" placeholder="см"></div>
            <div><label class="form-label" for="profile-waist">Талия</label><input class="form-control" id="profile-waist" name="waist" type="number" min="40" max="160" inputmode="numeric" placeholder="см"></div>
            <div><label class="form-label" for="profile-hips">Бёдра</label><input class="form-control" id="profile-hips" name="hips" type="number" min="50" max="180" inputmode="numeric" placeholder="см"></div>
            <div><label class="form-label" for="profile-inseam">Длина ноги по внутреннему шву</label><input class="form-control" id="profile-inseam" name="inseam" type="number" min="45" max="120" inputmode="numeric" placeholder="см"></div>
            <div><label class="form-label" for="profile-shoulders">Ширина плеч</label><input class="form-control" id="profile-shoulders" name="shoulders" type="number" min="25" max="70" inputmode="numeric" placeholder="см"></div>
            <div><label class="form-label" for="profile-sleeve">Длина рукава</label><input class="form-control" id="profile-sleeve" name="sleeve" type="number" min="35" max="90" inputmode="numeric" placeholder="см"></div>
          </div>
          <button class="btn btn-primary profile-save" type="submit">Сохранить параметры</button>
          <p class="profile-status" id="profile-status" role="status" aria-live="polite"></p>
        </section>
      </form>
    </main>

    <nav class="app-tabs" aria-label="Разделы приложения">
      <a class="app-tab" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><span>Каталог</span></a>
      <a class="app-tab" href="wardrobe.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l2 14H3L5 7ZM9 7a3 3 0 0 1 6 0"/></svg><span>Гардероб</span></a>
      <a class="app-tab" href="outfit-studio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg><span>Образы</span></a>
      <a class="app-tab is-active" href="style-profile.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Профиль</span></a>
    </nav>
    <script src="assets/js/app.js?v=looks-08"></script>
  </body>
</html>
